name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deliberately not SHA-pinned: Home Assistant publishes this validator
      # only on its master branch (no maintained releases), and it must track
      # current HA rules to be useful. It runs read-only, with no secrets.
      - uses: home-assistant/actions/hassfest@master
